<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=440, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
    body { display: grid; place-items: center; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 20% 10%, rgba(129,140,248,.38), transparent 48%), radial-gradient(circle at 90% 90%, rgba(217,70,239,.24), transparent 50%), #121625; }
    .tile { width: 100%; height: 100%; padding: 38px 42px; display: flex; flex-direction: column; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 760; letter-spacing: -1.4px; }
    img { width: 60px; height: 60px; border-radius: 15px; box-shadow: 0 14px 30px rgba(0,0,0,.28); }
    h1 { max-width: 330px; margin: 0; font-size: 28px; line-height: 1.18; letter-spacing: -1px; }
    p { margin: 8px 0 0; color: #aeb9cd; font-size: 15px; }
  </style>
</head>
<body><main class="tile"><div class="brand"><img src="../../icons/icon128.png" alt="">Tabel</div><div><h1>Organize. Sync. Restore.</h1><p>A clear visual dashboard for your Chrome tabs.</p></div></main></body>
</html>
