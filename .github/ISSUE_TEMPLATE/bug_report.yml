name: Bug report
description: Report a reproducible problem in Tabel
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include private URLs, exported Tabel data, credentials, or personal information.

  - type: input
    id: tabel-version
    attributes:
      label: Tabel version
      placeholder: "1.6.0"
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      placeholder: "Chrome 140"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence that reproduces the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private URLs, credentials, and personal data from this report.
          required: true
