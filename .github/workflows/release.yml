name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify tag and project
        shell: powershell
        run: |
          $version = (Get-Content -Raw -Encoding UTF8 manifest.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match manifest version $version."
          }
          npm test

      - name: Build Chrome Web Store package
        shell: powershell
        run: npm run build:release

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw -Encoding UTF8 manifest.json | ConvertFrom-Json).version
          $archive = "dist/tabel-$version-chrome-web-store.zip"
          $notes = "release/notes/$version.md"

          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing release notes: $notes"
          }

          $releaseTags = @(
            gh release list --limit 100 --json tagName |
              ConvertFrom-Json |
              ForEach-Object { $_.tagName }
          )

          if ($releaseTags -contains $env:GITHUB_REF_NAME) {
            gh release upload $env:GITHUB_REF_NAME $archive --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $archive `
              --verify-tag `
              --title "Tabel $version" `
              --notes-file $notes
          }
